<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>鉄骨認識 ダッシュボード</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --sidebar-w:220px;--bg:#f4f6fb;--surface:#fff;--border:#e8ecf3;
  --text:#1a1f36;--muted:#6b7280;--blue:#3b82f6;--blue-d:#2563eb;
  --green:#10b981;--red:#ef4444;--red-d:#dc2626;--yellow:#f59e0b;
  --radius:12px;--shadow:0 2px 12px rgba(0,0,0,.07);
}
body{font-family:'Segoe UI','Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}

/* サイドバー */
.sidebar{width:var(--sidebar-w);background:#1e2340;color:#c8cde8;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:22px 20px;border-bottom:1px solid #2d3355}
.logo-icon{font-size:24px}.logo-text{font-size:16px;font-weight:700;color:#fff;letter-spacing:.5px}
.sidebar-nav{flex:1;padding:16px 12px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;color:#8b92b8;text-decoration:none;font-size:14px;transition:background .15s,color .15s}
.nav-item:hover,.nav-item.active{background:#2d3355;color:#fff}
.sidebar-footer{padding:16px 20px;border-top:1px solid #2d3355}
.update-time{font-size:11px;color:#5a6080}

/* メイン */
.main-wrap{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.page-title{font-size:18px;font-weight:700}
.topbar-actions{display:flex;gap:10px;align-items:center}
.content{padding:24px 28px;display:flex;flex-direction:column;gap:20px}

/* ボタン */
.btn{padding:8px 18px;border-radius:8px;border:none;font-size:13px;font-weight:500;cursor:pointer;transition:opacity .15s,transform .1s,background .15s}
.btn:hover{opacity:.88}.btn:active{transform:scale(.97)}
.btn-primary{background:var(--blue);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ghost{background:transparent;color:var(--muted);font-size:13px;padding:8px 12px}
.btn-ghost:hover{color:var(--text)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{opacity:1;background:var(--red-d)}
.btn-danger:disabled{background:#fca5a5;cursor:not-allowed;opacity:1;transform:none}
.btn-danger-outline{background:transparent;border:1px solid var(--red);color:var(--red)}
.btn-danger-outline:hover{background:#fee2e2;opacity:1}

/* 選択アクションバー */
.selection-bar{
  display:none;align-items:center;gap:12px;padding:10px 16px;
  background:#fff8f8;border:1px solid #fecaca;border-radius:10px;
  animation:slideIn .2s ease;
}
.selection-bar.visible{display:flex}
.selection-count{font-size:13px;font-weight:600;color:var(--red);flex:1}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

/* カード */
.cards{display:grid;grid-template-columns:1fr;gap:16px}
.card{background:var(--surface);border-radius:var(--radius);padding:20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);border-top:3px solid transparent;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card-blue{border-color:var(--blue)}.card-green{border-color:var(--green)}.card-red{border-color:var(--red)}.card-yellow{border-color:var(--yellow)}
.card-icon{font-size:28px}
.card-label{font-size:12px;color:var(--muted);margin-bottom:4px}
.card-value{font-size:30px;font-weight:800;line-height:1}
.card-blue .card-value{color:var(--blue)}.card-green .card-value{color:var(--green)}.card-red .card-value{color:var(--red)}.card-yellow .card-value{color:var(--yellow)}

/* フィルター */
.filter-bar{background:var(--surface);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.filter-group{display:flex;flex-direction:column;gap:5px}
.filter-search{flex:1;min-width:200px}
.filter-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.filter-input{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--text);background:var(--bg);outline:none;transition:border-color .15s}
.filter-input:focus{border-color:var(--blue);background:#fff}
.filter-count{margin-left:auto;font-size:12px;color:var(--muted);align-self:center}

/* テーブル */
.table-section{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{background:#f8f9fc;padding:12px 16px;font-size:12px;font-weight:700;color:var(--muted);text-align:left;border-bottom:2px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
th.sortable{cursor:pointer;user-select:none;position:relative;padding-right:28px}
th.sortable::after{content:'↕';position:absolute;right:10px;opacity:.35;font-size:11px}
th.sortable.asc::after{content:'↑';opacity:1;color:var(--blue)}
th.sortable.desc::after{content:'↓';opacity:1;color:var(--blue)}
th.sortable:hover{background:#eef2ff;color:var(--blue)}
tbody td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .1s}
tbody tr:hover td{background:#f5f8ff}
tbody tr.selected td{background:#fff0f0}
tbody tr.selected:hover td{background:#ffe4e4}
.badge{display:inline-block;background:#eff6ff;color:var(--blue);border:1px solid #bfdbfe;border-radius:6px;padding:2px 8px;margin:2px;font-size:12px;font-weight:500}
.div-in{display:inline-block;background:#d1fae5;color:#065f46;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:700}
.div-out{display:inline-block;background:#fee2e2;color:#991b1b;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:700}
.empty-row{text-align:center;color:var(--muted);padding:48px;font-size:14px}

/* チェックボックス */
.cb-wrap{display:flex;align-items:center;justify-content:center}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--red);cursor:pointer;border-radius:4px}

/* 単一削除ボタン */
.btn-row-del{
  padding:4px 10px;border-radius:6px;border:1px solid #fca5a5;
  background:#fff;color:var(--red);font-size:12px;cursor:pointer;
  transition:background .15s,transform .1s;white-space:nowrap;
}
.btn-row-del:hover{background:#fee2e2}
.btn-row-del:active{transform:scale(.95)}

/* 削除確認モーダル */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);
  z-index:1000;align-items:center;justify-content:center;
  backdrop-filter:blur(2px);
}
.modal-overlay.open{display:flex}
.modal{
  background:#fff;border-radius:16px;padding:32px;max-width:440px;width:90%;
  box-shadow:0 20px 60px rgba(0,0,0,.2);animation:modalIn .22s ease;
}
@keyframes modalIn{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}
.modal-icon{font-size:36px;text-align:center;margin-bottom:12px}
.modal-title{font-size:18px;font-weight:800;text-align:center;color:var(--text);margin-bottom:8px}
.modal-body{font-size:14px;color:var(--muted);text-align:center;line-height:1.6;margin-bottom:24px}
.modal-body strong{color:var(--red)}
.modal-actions{display:flex;gap:10px;justify-content:center}
.modal-actions .btn{min-width:110px;padding:10px 20px;font-size:14px}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo"><span class="logo-icon">🏗</span><span class="logo-text">鉄骨認識</span></div>
  <nav class="sidebar-nav"><a href="#" class="nav-item active">📊 ダッシュボード</a></nav>
  <div class="sidebar-footer"><span id="lastUpdated" class="update-time">更新中...</span></div>
</aside>

<div class="main-wrap">
  <header class="topbar">
    <h1 class="page-title">ダッシュボード</h1>
    <div class="topbar-actions">
      <div id="selectionBar" class="selection-bar">
        <span class="selection-count" id="selectionCount">0件選択中</span>
        <button class="btn btn-danger-outline" onclick="clearSelection()">✕ 選択解除</button>
        <button class="btn btn-danger" id="btnBulkDelete" onclick="confirmBulkDelete()">🗑 選択削除</button>
      </div>
      <button class="btn btn-outline" onclick="fetchData()">🔄 更新</button>
      <button class="btn btn-primary" onclick="exportCsv()">⬇ CSV出力</button>
    </div>
  </header>

  <main class="content">
    <section class="cards">
      <div class="card card-blue">  <div class="card-icon">📦</div><div class="card-body"><div class="card-label">総登録件数</div><div class="card-value" id="cTotal">—</div></div></div>
    </section>

    <section class="filter-bar">
      <div class="filter-group"><label class="filter-label">日付</label><input type="date" id="filterDate" class="filter-input"/></div>
      <div class="filter-group filter-search"><label class="filter-label">工事名</label><input type="text" id="filterConst" class="filter-input" placeholder="工事名で絞り込み..."/></div>
      <div class="filter-group filter-search"><label class="filter-label">工程名</label><input type="text" id="filterProc" class="filter-input" placeholder="工程名で絞り込み..."/></div>
      <div class="filter-group filter-search"><label class="filter-label">製品番号</label><input type="text" id="filterSearch" class="filter-input" placeholder="キーワード検索..."/></div>
      <button class="btn btn-ghost" onclick="clearFilters()">✕ クリア</button>
      <div class="filter-count" id="countInfo"></div>
    </section>

    <section class="table-section">
      <table>
        <thead><tr>
          <th style="width:40px;text-align:center"><input type="checkbox" id="checkAll" title="すべて選択" onchange="toggleAll(this.checked)"/></th>
          <th class="sortable" data-key="id">ID</th>
          <th class="sortable" data-key="construction_name">工事名</th>
          <th class="sortable" data-key="process_name">工程名</th>
          <th>製品番号</th>
          <th class="sortable" data-key="received_at">受信日時</th>
          <th class="sortable" data-key="device_id">デバイスID</th>
          <th style="width:60px;text-align:center">削除</th>
        </tr></thead>
        <tbody id="tableBody"><tr><td colspan="7" class="empty-row">読み込み中...</td></tr></tbody>
      </table>
    </section>
  </main>
</div>

<!-- 削除確認モーダル -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-icon">⚠️</div>
    <div class="modal-title" id="modalTitle">削除の確認</div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-danger" id="modalConfirmBtn" onclick="execDelete()">削除する</button>
    </div>
  </div>
</div>

<script>
const API_KEY = 'cvf_7s_9922_zrkp_8x11';
let allData=[], sortKey='id', sortDir='desc';
let selectedIds = new Set();
let pendingDeleteIds = [];    // モーダル確認待ちのID群
let pendingDeleteSingle = false;

// ── データ取得 ──────────────────────────────────────────
async function fetchData(){
  const res = await fetch('/api/registrations');
  allData = await res.json();
  // 削除後に選択IDを再検証
  const existingIds = new Set(allData.map(d => d.id));
  selectedIds = new Set([...selectedIds].filter(id => existingIds.has(id)));
  updateCards(); updateTable();
  document.getElementById('lastUpdated').textContent = '最終更新 ' + new Date().toLocaleTimeString('ja-JP');
}

function updateCards(){
  document.getElementById('cTotal').textContent = allData.length;
}

// ── フィルター ──────────────────────────────────────────
function getFiltered(){
  const date = document.getElementById('filterDate').value;
  const constName = document.getElementById('filterConst').value.toLowerCase();
  const procName = document.getElementById('filterProc').value.toLowerCase();
  const search = document.getElementById('filterSearch').value.toLowerCase();
  return allData.filter(d=>{
    if(date && !(d.received_at||'').startsWith(date)) return false;
    if(constName && !(d.construction_name||'').toLowerCase().includes(constName)) return false;
    if(procName && !(d.process_name||'').toLowerCase().includes(procName)) return false;
    if(search && !d.product_numbers.some(n=>n.toLowerCase().includes(search))) return false;
    return true;
  });
}

function clearFilters(){
  document.getElementById('filterDate').value='';
  document.getElementById('filterConst').value='';
  document.getElementById('filterProc').value='';
  document.getElementById('filterSearch').value='';
  updateTable();
}

// ── ソート ──────────────────────────────────────────────
function handleSort(key){
  sortDir = sortKey===key ? (sortDir==='asc'?'desc':'asc') : 'asc';
  sortKey = key;
  document.querySelectorAll('th.sortable').forEach(th=>{
    th.classList.remove('asc','desc');
    if(th.dataset.key===key) th.classList.add(sortDir);
  });
  updateTable();
}

// ── テーブル描画 ────────────────────────────────────────
function updateTable(){
  const filtered = getFiltered();
  const sorted = [...filtered].sort((a,b)=>{
    let va=a[sortKey]??'', vb=b[sortKey]??'';
    if(typeof va==='number' && typeof vb==='number') return sortDir==='asc'?va-vb:vb-va;
    va=String(va).toLowerCase(); vb=String(vb).toLowerCase();
    const c=va<vb?-1:va>vb?1:0; return sortDir==='asc'?c:-c;
  });
  const tbody = document.getElementById('tableBody');
  if(sorted.length === 0){
    tbody.innerHTML='<tr><td colspan="7" class="empty-row">データがありません</td></tr>';
  } else {
    tbody.innerHTML = sorted.map(d=>{
      const sel = selectedIds.has(d.id);
      return `<tr class="${sel?'selected':''}" id="row-${d.id}">
        <td class="cb-wrap"><input type="checkbox" class="row-cb" data-id="${d.id}" ${sel?'checked':''} onchange="toggleRow(${d.id},this.checked)"/></td>
        <td>${d.id}</td>
        <td>${d.construction_name || '<span style="color:#aaa">—</span>'}</td>
        <td>${d.process_name || '<span style="color:#aaa">—</span>'}</td>
        <td>${(d.product_numbers||[]).map(n=>`<span class="badge">${n}</span>`).join('')}</td>
        <td>${(d.received_at||'').slice(0,19).replace('T',' ')}</td>
        <td>${d.device_id||''}</td>
        <td style="text-align:center"><button class="btn-row-del" onclick="confirmSingleDelete(${d.id})">🗑</button></td>
      </tr>`;
    }).join('');
  }
  document.getElementById('countInfo').textContent = `${filtered.length}件表示 / 全${allData.length}件`;
  updateCheckAll(sorted);
  updateSelectionBar();
}

// ── チェックボックス制御 ────────────────────────────────
function toggleRow(id, checked){
  if(checked) selectedIds.add(id); else selectedIds.delete(id);
  const row = document.getElementById(`row-${id}`);
  if(row) row.className = checked ? 'selected' : '';
  updateSelectionBar();
  updateCheckAllState();
}

function toggleAll(checked){
  const filtered = getFiltered();
  filtered.forEach(d=>{
    if(checked) selectedIds.add(d.id); else selectedIds.delete(d.id);
  });
  updateTable();
}

function clearSelection(){
  selectedIds.clear();
  updateTable();
}

function updateCheckAll(sortedFiltered){
  const ca = document.getElementById('checkAll');
  if(!ca) return;
  if(sortedFiltered.length === 0){ ca.checked=false; ca.indeterminate=false; return; }
  const selInView = sortedFiltered.filter(d=>selectedIds.has(d.id)).length;
  if(selInView === 0){ ca.checked=false; ca.indeterminate=false; }
  else if(selInView === sortedFiltered.length){ ca.checked=true; ca.indeterminate=false; }
  else { ca.checked=false; ca.indeterminate=true; }
}

function updateCheckAllState(){
  const filtered = getFiltered();
  updateCheckAll(filtered);
}

function updateSelectionBar(){
  const bar = document.getElementById('selectionBar');
  const cnt = document.getElementById('selectionCount');
  const n = selectedIds.size;
  if(n > 0){
    bar.classList.add('visible');
    cnt.textContent = `${n}件選択中`;
  } else {
    bar.classList.remove('visible');
  }
}

// ── 削除フロー ──────────────────────────────────────────
function confirmSingleDelete(id){
  const entry = allData.find(d=>d.id===id);
  if(!entry) return;
  const cName = entry.construction_name || '未指定';
  const pName = entry.process_name || '未指定';
  const nums = (entry.product_numbers||[]).join(', ');
  pendingDeleteIds = [id];
  pendingDeleteSingle = true;
  document.getElementById('modalTitle').textContent = 'データを削除しますか？';
  document.getElementById('modalBody').innerHTML =
    `ID <strong>${id}</strong><br>【${cName}】${pName}<br>（製品番号: ${nums}）を削除します。<br>この操作は元に戻せません。`;
  openModal();
}

function confirmBulkDelete(){
  if(selectedIds.size === 0) return;
  pendingDeleteIds = [...selectedIds];
  pendingDeleteSingle = false;
  document.getElementById('modalTitle').textContent = `${pendingDeleteIds.length}件を一括削除しますか？`;
  document.getElementById('modalBody').innerHTML =
    `選択した <strong>${pendingDeleteIds.length}件</strong> のデータを削除します。<br>この操作は元に戻せません。`;
  openModal();
}

function openModal(){ document.getElementById('modalOverlay').classList.add('open'); }
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); pendingDeleteIds=[]; }

async function execDelete(){
  if(pendingDeleteIds.length === 0) {
    closeModal();
    return;
  }
  
  // 削除対象をコピーしてからモーダルを閉じる（closeModalでクリアされるため）
  const targetIds = [...pendingDeleteIds];
  const isSingle = pendingDeleteSingle;
  closeModal();

  try {
    let res;
    if(isSingle && targetIds.length === 1){
      // 単一削除
      res = await fetch(`/api/registrations/${targetIds[0]}`, {
        method: 'DELETE',
        headers: { 'X-API-KEY': API_KEY }
      });
    } else {
      // 一括削除
      res = await fetch('/api/registrations', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json', 'X-API-KEY': API_KEY },
        body: JSON.stringify({ ids: targetIds })
      });
    }
    if(!res.ok){ const e=await res.json(); alert('削除に失敗しました: '+(e.detail||res.status)); return; }
    await fetchData();
  } catch(e){
    alert('通信エラーが発生しました: '+e.message);
  }
}

// ── CSV出力 ────────────────────────────────────────────
function exportCsv(){ window.location.href='/api/export/csv'; }

// ── イベント登録 ────────────────────────────────────────
document.querySelectorAll('th.sortable').forEach(th=>th.addEventListener('click',()=>handleSort(th.dataset.key)));
['filterDate','filterConst','filterProc','filterSearch'].forEach(id=>document.getElementById(id).addEventListener('input',updateTable));

// モーダルの外側クリックで閉じる
document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeModal(); });

fetchData();
setInterval(fetchData, 10000);
</script>
</body>
</html>
